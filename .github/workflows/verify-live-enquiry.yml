name: Verify live Solarist enquiry

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.event_name != 'issues' || github.event.issue.title == 'Verify Solarist live enquiry'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Wait for GitHub Pages publication
        shell: bash
        run: |
          set -euo pipefail
          published=false
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --location --max-time 20 https://solarist.in/ | grep -q "const responseOrigins = new Set"; then
              published=true
              break
            fi
            sleep 10
          done
          echo "PUBLISHED=${published}" >> "$GITHUB_ENV"

      - name: Install browser test dependencies
        if: env.PUBLISHED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/solarist-e2e
          cd /tmp/solarist-e2e
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Submit live form and verify popup
        shell: bash
        env:
          TEST_EMAIL: khuzaifa75@gmail.com
        run: |
          set -euo pipefail
          mkdir -p diagnostics

          if [[ "${PUBLISHED:-false}" != "true" ]]; then
            cat > diagnostics/live-form-latest.md <<'EOF'
          # Solarist live form verification

          - Result: **FAIL**
          - Reason: The latest enquiry-response code was not visible on the published GitHub Pages site within the verification window.
          EOF
          else
            cd /tmp/solarist-e2e
            cat > verify.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          (async () => {
            const workspace = process.env.GITHUB_WORKSPACE;
            const output = path.join(workspace, 'diagnostics/live-form-latest.md');
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1365, height: 900 } });
            const started = new Date().toISOString();
            let result = 'FAIL';
            let detail = '';
            let statusText = '';

            try {
              await page.goto('https://solarist.in/#contact', { waitUntil: 'networkidle', timeout: 60000 });
              await page.fill('#name', 'Solarist Live Browser Test');
              await page.fill('#company', 'Solarist');
              await page.fill('#email', process.env.TEST_EMAIL);
              await page.selectOption('#market', { label: 'Internal company workflow' });
              await page.selectOption('#service', { label: 'Other technical enquiry' });
              await page.fill('#message', 'Live browser verification of Sheet logging, both emails, and the confirmation popup.');
              await page.click('#solaristEnquiryForm button[type="submit"]');
              await page.waitForSelector('#enquiryConfirmation.is-open', { state: 'visible', timeout: 45000 });
              const heading = (await page.locator('#enquiryConfirmationTitle').textContent() || '').trim();
              if (heading !== 'Enquiry submitted.') throw new Error(`Unexpected confirmation heading: ${heading}`);
              result = 'PASS';
              detail = 'The published site submitted the form and displayed the confirmation popup.';
            } catch (error) {
              statusText = (await page.locator('.form-submit-state').textContent().catch(() => ''))?.trim() || '';
              detail = `${error.name}: ${error.message}`;
            } finally {
              const lines = [
                '# Solarist live form verification',
                '',
                `- Checked: \`${started}\``,
                `- Result: **${result}**`,
                `- Detail: ${detail}`,
                `- Visible form status: ${statusText || 'None'}`,
                '',
              ];
              fs.writeFileSync(output, lines.join('\n'), 'utf8');
              await browser.close();
            }
          })();
          NODE
            node verify.js
          fi

      - name: Commit live verification result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/live-form-latest.md
          if git diff --cached --quiet; then
            echo 'No verification change to commit.'
          else
            git commit -m 'Record live Solarist enquiry verification'
            git push
          fi
