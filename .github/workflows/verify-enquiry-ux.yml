name: Verify Solarist enquiry UX

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.event_name != 'issues' || github.event.issue.title == 'Verify Solarist enquiry UX'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Wait for polished site publication
        shell: bash
        run: |
          set -euo pipefail
          published=false
          for attempt in $(seq 1 36); do
            if curl --silent --show-error --location --max-time 20 https://solarist.in/ | grep -q 'solarist-enquiry-experience-v2'; then
              published=true
              break
            fi
            sleep 10
          done
          echo "PUBLISHED=${published}" >> "$GITHUB_ENV"

      - name: Install Playwright
        if: env.PUBLISHED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/solarist-ux
          cd /tmp/solarist-ux
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Verify immediate feedback, success and autofill
        shell: bash
        env:
          TEST_EMAIL: khuzaifa75@gmail.com
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          if [[ "${PUBLISHED:-false}" != "true" ]]; then
            cat > diagnostics/enquiry-ux-latest.md <<'EOF'
          # Solarist enquiry UX verification

          - Result: **FAIL**
          - Reason: The polished enquiry code was not published within the verification window.
          EOF
            exit 0
          fi

          cd /tmp/solarist-ux
          cat > verify.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          (async () => {
            const workspace = process.env.GITHUB_WORKSPACE;
            const output = path.join(workspace, 'diagnostics/enquiry-ux-latest.md');
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1365, height: 900 } });
            const checked = new Date().toISOString();
            let result = 'FAIL';
            let detail = '';
            let sendingMs = null;
            let confirmedMs = null;
            let closeMs = null;
            let autofill = {};

            try {
              await page.goto('https://solarist.in/#contact', { waitUntil: 'networkidle', timeout: 60000 });

              autofill = await page.evaluate(() => ({
                form: document.querySelector('#solaristEnquiryForm')?.getAttribute('autocomplete'),
                name: document.querySelector('#name')?.getAttribute('autocomplete'),
                company: document.querySelector('#company')?.getAttribute('autocomplete'),
                email: document.querySelector('#email')?.getAttribute('autocomplete'),
                emailInputMode: document.querySelector('#email')?.getAttribute('inputmode'),
                message: document.querySelector('#message')?.getAttribute('autocomplete'),
              }));

              await page.fill('#name', 'Solarist Enquiry UX Test');
              await page.fill('#company', 'Solarist');
              await page.fill('#email', process.env.TEST_EMAIL);
              await page.selectOption('#market', { label: 'Internal company workflow' });
              await page.selectOption('#service', { label: 'Other technical enquiry' });
              await page.fill('#message', 'Published-site verification of immediate sending feedback, confirmed success, closing motion and browser autofill attributes.');

              const started = Date.now();
              await page.click('#solaristEnquiryForm button[type="submit"]');
              await page.waitForSelector('#enquiryConfirmation.is-open[data-state="sending"]', { state: 'visible', timeout: 1500 });
              sendingMs = Date.now() - started;

              await page.waitForFunction(() => {
                const modal = document.getElementById('enquiryConfirmation');
                return modal?.classList.contains('is-open') && modal.dataset.state === 'success';
              }, null, { timeout: 45000 });
              confirmedMs = Date.now() - started;

              const heading = (await page.locator('#enquiryConfirmationTitle').textContent() || '').trim();
              if (heading !== 'Enquiry submitted.') throw new Error(`Unexpected confirmation heading: ${heading}`);

              const closeStarted = Date.now();
              await page.click('#enquiryConfirmationClose');
              await page.waitForFunction(() => !document.getElementById('enquiryConfirmation')?.classList.contains('is-open'), null, { timeout: 2000 });
              closeMs = Date.now() - closeStarted;

              const autofillOkay = autofill.form === 'on' && autofill.name === 'name' && autofill.company === 'organization' && autofill.email === 'email' && autofill.emailInputMode === 'email' && autofill.message === 'on';
              if (!autofillOkay) throw new Error(`Unexpected autofill attributes: ${JSON.stringify(autofill)}`);
              if (sendingMs > 1000) throw new Error(`Sending feedback appeared too slowly: ${sendingMs} ms`);

              result = 'PASS';
              detail = 'Immediate sending feedback, confirmed success, close transition and autofill markup all passed.';
            } catch (error) {
              detail = `${error.name}: ${error.message}`;
            } finally {
              const lines = [
                '# Solarist enquiry UX verification',
                '',
                `- Checked: \`${checked}\``,
                `- Result: **${result}**`,
                `- Detail: ${detail}`,
                `- Sending panel visible after: ${sendingMs === null ? 'Not observed' : `**${sendingMs} ms**`}`,
                `- Server-confirmed success after: ${confirmedMs === null ? 'Not observed' : `**${confirmedMs} ms**`}`,
                `- Close transition completed in: ${closeMs === null ? 'Not observed' : `**${closeMs} ms**`}`,
                `- Autofill attributes: \`${JSON.stringify(autofill)}\``,
                '',
              ];
              fs.writeFileSync(output, lines.join('\n'), 'utf8');
              await browser.close();
            }
          })();
          NODE
          node verify.js

      - name: Commit UX verification result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/enquiry-ux-latest.md
          if git diff --cached --quiet; then
            echo 'No UX verification change to commit.'
          else
            git commit -m 'Record Solarist enquiry UX verification'
            git push
          fi
