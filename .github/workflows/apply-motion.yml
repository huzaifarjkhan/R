name: Apply Solarist motion system

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.issue.title == 'Apply Solarist motion system'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Inject reusable motion system
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          marker = 'solarist-motion-v1'
          if marker in html:
              print('Motion system already present; no HTML update required.')
          else:
              css = r'''
          <style id="solarist-motion-v1">
          :root{
            --sol-motion-duration:760ms;
            --sol-motion-distance:30px;
            --sol-motion-ease:cubic-bezier(.2,.72,.28,1);
          }
          .motion-reveal{
            opacity:0;
            transform:translate3d(0,var(--sol-motion-distance),0);
            filter:blur(2px);
            transition:
              opacity var(--sol-motion-duration) var(--sol-motion-ease),
              transform var(--sol-motion-duration) var(--sol-motion-ease),
              filter calc(var(--sol-motion-duration) * .8) var(--sol-motion-ease);
            transition-delay:calc(var(--motion-index,0) * 65ms);
            will-change:opacity,transform,filter;
          }
          .motion-reveal[data-motion="left"]{transform:translate3d(calc(var(--sol-motion-distance) * -1),0,0)}
          .motion-reveal[data-motion="right"]{transform:translate3d(var(--sol-motion-distance),0,0)}
          .motion-reveal[data-motion="scale"]{transform:scale(.965);filter:blur(1px)}
          .motion-reveal[data-motion="fade"]{transform:none;filter:none}
          .motion-reveal.is-inview{opacity:1;transform:none;filter:none}

          .site-header{
            transition:background-color 320ms ease,border-color 320ms ease,box-shadow 320ms ease;
          }
          .site-header.is-scrolled{
            background:rgb(247 244 239/.985);
            box-shadow:0 10px 30px rgb(17 16 15/.055);
          }

          .card,.panel,.ai,.step,.tool,.metric,.hero-note,.portrait{
            transition:
              transform 360ms var(--sol-motion-ease),
              box-shadow 360ms var(--sol-motion-ease),
              border-color 360ms ease,
              background-color 360ms ease;
          }
          .card,.panel,.ai,.tool,.portrait{position:relative;overflow:hidden}
          .card::before,.panel::before,.ai::before,.tool::before{
            content:"";
            position:absolute;
            top:0;left:0;
            width:100%;height:2px;
            background:var(--sol-action-accent);
            transform:scaleX(0);
            transform-origin:left;
            transition:transform 360ms var(--sol-motion-ease);
          }

          .button{
            transition:transform 220ms ease,box-shadow 220ms ease,background-color 220ms ease,border-color 220ms ease;
          }
          .text-link{
            position:relative;
            text-decoration:none;
          }
          .text-link::after{
            content:"";
            position:absolute;
            left:0;bottom:-.18rem;
            width:100%;height:1px;
            background:currentColor;
            transform:scaleX(.18);
            transform-origin:left;
            transition:transform 260ms ease;
          }

          .portrait-overlay{
            transition:transform 420ms var(--sol-motion-ease),background-color 320ms ease;
          }

          @media (hover:hover) and (pointer:fine){
            .card:hover,.panel:hover,.ai:hover,.tool:hover{
              transform:translateY(-6px);
              box-shadow:0 18px 44px rgb(17 16 15/.09);
              border-color:rgb(168 64 13/.35);
            }
            .metric:hover{transform:translateY(-4px);background:rgb(255 255 255/.035)}
            .card:hover::before,.panel:hover::before,.ai:hover::before,.tool:hover::before{transform:scaleX(1)}
            .button:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgb(17 16 15/.12)}
            .text-link:hover::after{transform:scaleX(1)}
            .portrait:hover .portrait-overlay{transform:translateY(-4px);background:rgb(17 16 15/.96)}
          }

          @media (max-width:48rem){
            :root{
              --sol-motion-duration:620ms;
              --sol-motion-distance:18px;
            }
            .motion-reveal{transition-delay:calc(var(--motion-index,0) * 38ms);filter:none}
            .card,.panel,.ai,.tool,.metric{will-change:auto}
          }

          @media (prefers-reduced-motion:reduce){
            .motion-reveal,.motion-reveal[data-motion]{
              opacity:1!important;
              transform:none!important;
              filter:none!important;
              transition:none!important;
            }
            .card,.panel,.ai,.step,.tool,.metric,.button,.portrait,.portrait-overlay,.site-header{
              transition:none!important;
            }
          }
          </style>
          '''

              js = r'''
          <script id="solarist-motion-script-v1">
          (()=>{
            const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const assigned=new Set();
            const groups=[
              ['.hero .eyebrow,.hero h1,.hero .lead,.hero .actions,.hero .location','up'],
              ['.hero-note','left'],
              ['section .section-head','up'],
              ['.service-grid .card','up'],
              ['.metrics .metric','scale'],
              ['.four .panel','up'],
              ['.automation .problem','left'],
              ['.automation .ai','right'],
              ['.process .step','up'],
              ['.tools-grid .tool','scale'],
              ['.founder .portrait','left'],
              ['.founder>div:last-child','right'],
              ['.contact .field,.contact .submit,.contact .form-note','up'],
              ['footer .footer-grid,footer .footer-bottom','up']
            ];

            groups.forEach(([selector,motion])=>{
              document.querySelectorAll(selector).forEach((el,index)=>{
                if(assigned.has(el)) return;
                assigned.add(el);
                el.classList.add('motion-reveal');
                el.dataset.motion=motion;
                el.style.setProperty('--motion-index',String(index%6));
              });
            });

            if(reduced){
              assigned.forEach(el=>el.classList.add('is-inview'));
            }else{
              const observer=new IntersectionObserver(entries=>{
                entries.forEach(entry=>{
                  if(entry.isIntersecting){
                    entry.target.classList.add('is-inview');
                  }else{
                    entry.target.classList.remove('is-inview');
                  }
                });
              },{threshold:.12,rootMargin:'-3% 0px -8% 0px'});
              assigned.forEach(el=>observer.observe(el));
            }

            const header=document.querySelector('.site-header');
            const updateHeader=()=>header?.classList.toggle('is-scrolled',window.scrollY>18);
            updateHeader();
            window.addEventListener('scroll',updateHeader,{passive:true});
          })();
          </script>
          '''

              html = html.replace('</head>', css + '\n</head>', 1)
              html = html.replace('</body>', js + '\n</body>', 1)
              path.write_text(html, encoding='utf-8')
              print('Injected Solarist motion system.')
          PY

          rm -f .github/workflows/apply-motion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/apply-motion.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add persistent section and card animations'
          git push
