name: Test Solarist enquiry pipeline

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: Valid email that should receive the visitor confirmation
        required: true
        default: huzaifarjkhan@gmail.com
        type: string

permissions:
  contents: read

jobs:
  test-enquiry:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Submit test enquiry to Google Apps Script
        env:
          TEST_EMAIL: ${{ inputs.test_email }}
          ENDPOINT: https://script.google.com/macros/s/AKfycbz2QghMUkVE-aLRTAjIxoGC-xHk0ArBqOP9a52XqDblG6EVhKaMXDXP1Sf1y2fpfgR3/exec
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$TEST_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[A-Za-z]{2,}$ ]] || [[ "$TEST_EMAIL" == *".."* ]]; then
            echo "The test email is not valid."
            exit 1
          fi

          response=$(curl --silent --show-error --location --fail-with-body \
            --max-time 45 \
            --data-urlencode "name=Solarist GitHub Actions Test" \
            --data-urlencode "company=Solarist" \
            --data-urlencode "email=$TEST_EMAIL" \
            --data-urlencode "project_market=Internal company workflow" \
            --data-urlencode "service=Website form integration test" \
            --data-urlencode "message=Automated end-to-end test of Google Sheet logging and both MailApp notifications." \
            --data-urlencode "source_url=github-actions:test-solarist-enquiry" \
            "$ENDPOINT")

          printf '%s' "$response" > /tmp/solarist-response.html

          grep -q '"logged":true' /tmp/solarist-response.html || {
            echo "Apps Script did not confirm that the Sheet row was logged."
            cat /tmp/solarist-response.html
            exit 1
          }

          grep -q '"ownerEmailSent":true' /tmp/solarist-response.html || {
            echo "Apps Script did not confirm the owner notification email."
            cat /tmp/solarist-response.html
            exit 1
          }

          grep -q '"visitorEmailSent":true' /tmp/solarist-response.html || {
            echo "Apps Script did not confirm the visitor confirmation email."
            cat /tmp/solarist-response.html
            exit 1
          }

          echo "PASS: Sheet logging, owner email, and visitor email were all accepted by Apps Script."
