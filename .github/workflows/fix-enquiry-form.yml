name: Repair and verify Solarist enquiry form

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  repair-and-test:
    if: github.event_name != 'issues' || github.event.issue.title == 'Run Solarist enquiry repair'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Fix browser confirmation response
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          current = (
              "  window.addEventListener('message', event => {\n"
              "    if (!pending || event.source !== sink.contentWindow) return;"
          )
          original = (
              "  window.addEventListener('message', event => {\n"
              "    if (!pending || event.origin !== window.location.origin) return;"
          )
          replacement = (
              "  const responseOrigins = new Set([\n"
              "    window.location.origin,\n"
              "    'https://solarist.in',\n"
              "    'https://www.solarist.in',\n"
              "  ]);\n\n"
              "  window.addEventListener('message', event => {\n"
              "    if (!pending || !responseOrigins.has(event.origin)) return;"
          )

          if current in text:
              text = text.replace(current, replacement, 1)
          elif original in text:
              text = text.replace(original, replacement, 1)
          elif 'const responseOrigins = new Set([' not in text:
              raise SystemExit('Enquiry message listener was not found.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Test deployed Apps Script endpoint
        shell: bash
        env:
          ENDPOINT: https://script.google.com/macros/s/AKfycbz2QghMUkVE-aLRTAjIxoGC-xHk0ArBqOP9a52XqDblG6EVhKaMXDXP1Sf1y2fpfgR3/exec
          TEST_EMAIL: khuzaifa75@gmail.com
        run: |
          set +e
          mkdir -p diagnostics
          http_code=$(curl --silent --show-error --location \
            --max-time 45 \
            --output /tmp/solarist-apps-script-response.html \
            --write-out '%{http_code}' \
            --data-urlencode 'name=Solarist Production Diagnostic' \
            --data-urlencode 'company=Solarist' \
            --data-urlencode "email=${TEST_EMAIL}" \
            --data-urlencode 'project_market=Internal company workflow' \
            --data-urlencode 'service=Website form integration test' \
            --data-urlencode 'message=Production diagnostic for Sheet logging, owner email, visitor email and confirmation response.' \
            --data-urlencode 'source_url=github-actions:repair-and-verify' \
            "$ENDPOINT")
          curl_exit=$?
          export HTTP_CODE="$http_code" CURL_EXIT="$curl_exit"

          python - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import urllib.parse
          from pathlib import Path

          raw_path = Path('/tmp/solarist-apps-script-response.html')
          raw = raw_path.read_text(encoding='utf-8', errors='replace') if raw_path.exists() else ''
          payload = None
          parse_error = ''

          try:
              direct_redirect = re.search(r'window\.location\.replace\(("(?:\\.|[^"\\])*")\)', raw)
              encoded_bridge = re.search(r'enquiry-response\.html#(%7B.*?%7D)', raw)
              if direct_redirect:
                  bridge_url = json.loads(direct_redirect.group(1))
                  fragment = urllib.parse.urlsplit(bridge_url).fragment
                  payload = json.loads(urllib.parse.unquote(fragment))
              elif encoded_bridge:
                  payload = json.loads(urllib.parse.unquote(encoded_bridge.group(1)))
              else:
                  direct_message = re.search(r'window\.parent\.postMessage\((\{.*?\}),\s*["\']\*["\']\)', raw, re.S)
                  if direct_message:
                      payload = json.loads(direct_message.group(1))
                  else:
                      parse_error = 'No Solarist response payload was found in the returned HTML.'
          except Exception as exc:
              parse_error = f'{type(exc).__name__}: {exc}'

          timestamp = dt.datetime.now(dt.timezone.utc).isoformat()
          http_code = os.environ.get('HTTP_CODE', '')
          curl_exit = os.environ.get('CURL_EXIT', '')
          status = 'PASS' if isinstance(payload, dict) and payload.get('ok') and payload.get('logged') else 'FAIL'

          lines = [
              '# Solarist enquiry endpoint diagnostic',
              '',
              f'- Checked: `{timestamp}`',
              f'- HTTP status: `{http_code}`',
              f'- curl exit code: `{curl_exit}`',
              f'- Result: **{status}**',
              '',
              '## Parsed response',
              '',
              '```json',
              json.dumps(payload, indent=2, ensure_ascii=False) if payload is not None else json.dumps({'parseError': parse_error}, indent=2),
              '```',
              '',
              '## Returned HTML excerpt',
              '',
              '```html',
              raw[:6000],
              '```',
              '',
          ]
          Path('diagnostics/apps-script-latest.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Commit repair and diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html diagnostics/apps-script-latest.md
          if git diff --cached --quiet; then
            echo 'No repository changes were needed.'
          else
            git commit -m 'Allow trusted Solarist enquiry responses and verify backend'
            git push
          fi
