name: Apply parallel Solarist enquiry form

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.issue.title == 'Apply parallel Solarist enquiry form'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Add parallel Sheet and FormSubmit delivery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'SOLARIST_PARALLEL_FORM_V1' in s:
              raise SystemExit('Parallel form system already present')

          old_form = '<form action="https://formsubmit.co/huzaifarjkhan@gmail.com" method="POST">'
          new_form = '<form id="solaristEnquiryForm" action="https://formsubmit.co/huzaifarjkhan@gmail.com" method="POST" target="formsubmitSink">'
          if old_form not in s:
              raise SystemExit('Contact form opening tag not found')
          s = s.replace(old_form, new_form, 1)

          old_hidden = '<input type="hidden" name="_template" value="table">'
          new_hidden = old_hidden + '<input type="hidden" name="_autoresponse" value="Thank you for contacting Solarist. Your project enquiry has been received. We will review the details and respond within one to two business days."><input type="hidden" name="source_url" id="formSourceUrl" value=""><input type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">'
          if old_hidden not in s:
              raise SystemExit('FormSubmit hidden fields not found')
          s = s.replace(old_hidden, new_hidden, 1)

          css = r'''
<style id="solarist-parallel-form-style">
/* SOLARIST_PARALLEL_FORM_V1 */
.formsubmit-sink{position:fixed;width:1px;height:1px;border:0;clip:rect(0 0 0 0);clip-path:inset(50%);overflow:hidden;white-space:nowrap}
.enquiry-confirmation{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:1.25rem;background:rgb(17 16 15/.64);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity 260ms ease,visibility 0s linear 260ms}
.enquiry-confirmation.is-open{opacity:1;visibility:visible;transition:opacity 260ms ease,visibility 0s linear 0s}
.enquiry-confirmation-card{width:min(31rem,100%);background:var(--sol-surface-page);border:1px solid var(--sol-border-subtle);padding:clamp(1.6rem,5vw,2.4rem);box-shadow:0 28px 80px rgb(17 16 15/.22);transform:translateY(16px) scale(.985);transition:transform 320ms cubic-bezier(.2,.72,.28,1)}
.enquiry-confirmation.is-open .enquiry-confirmation-card{transform:translateY(0) scale(1)}
.enquiry-confirmation-mark{display:grid;place-items:center;width:2.5rem;height:2.5rem;margin-bottom:1.2rem;border:1px solid var(--sol-action-accent);color:var(--sol-text-accent);font:600 1rem var(--sol-font-data)}
.enquiry-confirmation h2{font:400 clamp(1.7rem,4vw,2.25rem)/1.08 var(--sol-font-display);margin:0 0 .8rem;letter-spacing:-.03em}
.enquiry-confirmation p{margin:0 0 1.4rem;color:var(--sol-text-secondary);font-size:.94rem}
.enquiry-confirmation .button{cursor:pointer}
.form-submit-state{display:block;grid-column:1/-1;min-height:1.2rem;margin:0;color:var(--sol-text-muted);font-size:.78rem}
@media(prefers-reduced-motion:reduce){.enquiry-confirmation,.enquiry-confirmation-card{transition:none!important}}
</style>
'''
          s = s.replace('</head>', css + '</head>', 1)

          modal = r'''
<iframe class="formsubmit-sink" name="formsubmitSink" title="Background form delivery" aria-hidden="true"></iframe>
<div class="enquiry-confirmation" id="enquiryConfirmation" aria-hidden="true">
  <div class="enquiry-confirmation-card" role="dialog" aria-modal="true" aria-labelledby="enquiryConfirmationTitle" tabindex="-1">
    <div class="enquiry-confirmation-mark" aria-hidden="true">✓</div>
    <h2 id="enquiryConfirmationTitle">Enquiry submitted.</h2>
    <p>Thank you for contacting Solarist. Your details have been received, and we will respond within one to two business days.</p>
    <button class="button primary" type="button" id="enquiryConfirmationClose">Close</button>
  </div>
</div>
'''
          s = s.replace('</body>', modal + '</body>', 1)

          js = r'''
<script id="solarist-parallel-form-script">
(() => {
  const SHEET_ENDPOINT = 'https://script.google.com/macros/s/AKfycbz2QghMUkVE-aLRTAjIxoGC-xHk0ArBqOP9a52XqDblG6EVhKaMXDXP1Sf1y2fpfgR3/exec';
  const form = document.getElementById('solaristEnquiryForm');
  const modal = document.getElementById('enquiryConfirmation');
  const modalCard = modal?.querySelector('.enquiry-confirmation-card');
  const closeButton = document.getElementById('enquiryConfirmationClose');
  let lastFocused = null;

  if (!form || !modal || !closeButton) return;

  let state = form.querySelector('.form-submit-state');
  if (!state) {
    state = document.createElement('p');
    state.className = 'form-submit-state';
    state.setAttribute('role', 'status');
    state.setAttribute('aria-live', 'polite');
    form.appendChild(state);
  }

  const openConfirmation = () => {
    lastFocused = document.activeElement;
    modal.classList.add('is-open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    window.setTimeout(() => modalCard?.focus(), 60);
  };

  const closeConfirmation = () => {
    modal.classList.remove('is-open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    lastFocused?.focus?.();
  };

  closeButton.addEventListener('click', closeConfirmation);
  modal.addEventListener('click', event => {
    if (event.target === modal) closeConfirmation();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && modal.classList.contains('is-open')) closeConfirmation();
  });

  const sheetPayloadFrom = data => {
    const submittedAt = new Date().toISOString();
    const sourceUrl = window.location.href;
    const name = String(data.get('name') || '').trim();
    const company = String(data.get('company') || '').trim();
    const email = String(data.get('email') || '').trim();
    const service = String(data.get('service') || '').trim();
    const projectMarket = String(data.get('project_market') || '').trim();
    const requirements = String(data.get('message') || '').trim();

    return {
      submittedAt,
      submitted_at: submittedAt,
      name,
      company,
      email,
      workEmail: email,
      service,
      project_market: projectMarket,
      projectMarket,
      market: projectMarket,
      message: requirements,
      requirements,
      sourceUrl,
      source_url: sourceUrl,
      status: 'New',
      internalNotes: '',
      'Submitted At (UTC)': submittedAt,
      'Name': name,
      'Company': company,
      'Work Email': email,
      'Service': service,
      'Project Market': projectMarket,
      'Requirements': requirements,
      'Source URL': sourceUrl,
      'Status': 'New',
      'Internal Notes': ''
    };
  };

  const sendToSheet = payload => {
    const query = new URLSearchParams();
    Object.entries(payload).forEach(([key, value]) => query.set(key, String(value ?? '')));
    return fetch(`${SHEET_ENDPOINT}?${query.toString()}`, {
      method: 'POST',
      mode: 'no-cors',
      cache: 'no-store',
      headers: {'Content-Type': 'text/plain;charset=UTF-8'},
      body: JSON.stringify(payload),
      keepalive: true
    });
  };

  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    const submitButton = form.querySelector('button[type="submit"],input[type="submit"]');
    const originalLabel = submitButton?.textContent || '';
    if (submitButton) {
      submitButton.disabled = true;
      submitButton.textContent = 'Sending…';
    }
    state.textContent = 'Submitting your enquiry…';

    const sourceField = document.getElementById('formSourceUrl');
    if (sourceField) sourceField.value = window.location.href;

    const formData = new FormData(form);
    const payload = sheetPayloadFrom(formData);

    const sheetRequest = sendToSheet(payload).catch(error => {
      console.error('Solarist sheet delivery failed:', error);
      return null;
    });

    try {
      HTMLFormElement.prototype.submit.call(form);
    } catch (error) {
      console.error('Solarist FormSubmit delivery failed:', error);
    }

    await Promise.race([
      sheetRequest,
      new Promise(resolve => window.setTimeout(resolve, 4500))
    ]);

    form.reset();
    state.textContent = '';
    if (submitButton) {
      submitButton.disabled = false;
      submitButton.textContent = originalLabel || 'Send enquiry';
    }
    openConfirmation();
  });
})();
</script>
'''
          s = s.replace('</body>', js + '</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/apply-parallel-enquiry-form.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/apply-parallel-enquiry-form.yml
          git commit -m 'Submit enquiries to Sheets and FormSubmit in parallel'
          git push
