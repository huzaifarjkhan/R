name: Fix Solarist motion coverage

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.issue.title == 'Fix Solarist motion coverage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Extend motion coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("['.founder .portrait','left'],", "['#about .portrait','left'],")
          s=s.replace("['.founder>div:last-child','right'],", "['#about .grid2>div:last-child','right'],")
          s=s.replace("['.contact .field,.contact .submit,.contact .form-note','up'],", "['.proof .proof-note','fade'],\n      ['#contact .grid2>div:first-child','left'],\n      ['.contact .field,.contact .submit,.contact .form-note','up'],")
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/fix-motion-coverage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-motion-coverage.yml
          git commit -m 'Extend animations to founder and contact sections'
          git push
