name: Polish Solarist enquiry experience

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    if: github.event_name != 'issues' || github.event.issue.title == 'Polish Solarist enquiry experience'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Apply polished enquiry experience
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          style = r'''
          <style id="solarist-enquiry-experience-v2">
          .enquiry-confirmation{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:clamp(1rem,4vw,2rem);background:rgb(17 16 15/.66);backdrop-filter:blur(18px) saturate(.78);-webkit-backdrop-filter:blur(18px) saturate(.78);opacity:0;visibility:hidden;pointer-events:none;transition:opacity 320ms ease,visibility 0s linear 320ms}
          .enquiry-confirmation.is-open{opacity:1;visibility:visible;pointer-events:auto;transition:opacity 320ms ease,visibility 0s}
          .enquiry-confirmation.is-closing{opacity:0;visibility:visible;pointer-events:none}
          .enquiry-confirmation-card{position:relative;isolation:isolate;width:min(35rem,100%);overflow:hidden;background:var(--sol-surface-page);border:1px solid rgb(17 16 15/.1);border-radius:10px;padding:clamp(2rem,6vw,3.15rem);box-shadow:0 36px 110px rgb(0 0 0/.34);opacity:0;transform:translate3d(0,28px,0) scale(.965);filter:blur(7px);transition:opacity 320ms ease,transform 520ms cubic-bezier(.16,1,.3,1),filter 420ms ease}
          .enquiry-confirmation-card::before{content:none!important}
          .enquiry-confirmation.is-open .enquiry-confirmation-card{opacity:1;transform:none;filter:none}
          .enquiry-confirmation.is-closing .enquiry-confirmation-card{opacity:0;transform:translate3d(0,16px,0) scale(.982);filter:blur(4px);transition-duration:240ms}
          .enquiry-confirmation-accent{position:absolute;z-index:-1;top:0;left:0;width:100%;height:4px;background:linear-gradient(90deg,var(--sol-action-accent),#ef9a68 58%,var(--sol-action-accent));transform-origin:left;transform:scaleX(.12);opacity:.7;transition:transform 780ms cubic-bezier(.16,1,.3,1),opacity 360ms ease}
          .enquiry-confirmation.is-open .enquiry-confirmation-accent{transform:scaleX(1);opacity:1}
          .enquiry-confirmation-mark{position:relative;display:grid;place-items:center;width:4rem;height:4rem;margin:0 0 1.45rem;border:1px solid rgb(168 64 13/.5);border-radius:50%;color:var(--sol-text-accent);font:600 1.45rem/1 var(--sol-font-data);background:rgb(168 64 13/.035);transition:background-color 300ms ease,border-color 300ms ease,transform 420ms cubic-bezier(.16,1,.3,1)}
          .enquiry-confirmation-symbol{display:block;opacity:0;transform:scale(.55) rotate(-12deg)}
          .enquiry-confirmation[data-state="sending"] .enquiry-confirmation-mark::before{content:"";position:absolute;inset:7px;border:2px solid rgb(168 64 13/.16);border-top-color:var(--sol-action-accent);border-radius:50%;animation:solarist-enquiry-spin .82s linear infinite}
          .enquiry-confirmation[data-state="success"] .enquiry-confirmation-mark{background:rgb(168 64 13/.08);transform:scale(1.02)}
          .enquiry-confirmation[data-state="success"] .enquiry-confirmation-symbol{opacity:1;transform:none;animation:solarist-enquiry-check 620ms cubic-bezier(.16,1,.3,1)}
          .enquiry-confirmation[data-state="error"] .enquiry-confirmation-mark{border-color:#8c342c;color:#8c342c;background:rgb(140 52 44/.06)}
          .enquiry-confirmation[data-state="error"] .enquiry-confirmation-symbol{opacity:1;transform:none}
          .enquiry-confirmation-kicker{margin:0 0 .75rem;color:var(--sol-text-accent);font:600 .69rem/1.3 var(--sol-font-data);letter-spacing:.14em;text-transform:uppercase}
          .enquiry-confirmation h2{max-width:11ch;margin:0 0 1rem;font:400 clamp(2.15rem,7vw,3.45rem)/.98 var(--sol-font-display);letter-spacing:-.045em;text-wrap:balance}
          .enquiry-confirmation-copy{max-width:42ch;margin:0;color:var(--sol-text-secondary);font-size:clamp(.95rem,2vw,1.03rem);line-height:1.68}
          .enquiry-confirmation-progress{position:relative;height:3px;margin:1.65rem 0 0;overflow:hidden;background:rgb(17 16 15/.08);opacity:0;transition:opacity 240ms ease}
          .enquiry-confirmation-progress span{position:absolute;inset:0;width:42%;background:var(--sol-action-accent);transform:translateX(-120%)}
          .enquiry-confirmation[data-state="sending"] .enquiry-confirmation-progress{opacity:1}
          .enquiry-confirmation[data-state="sending"] .enquiry-confirmation-progress span{animation:solarist-enquiry-progress 1.2s cubic-bezier(.65,0,.35,1) infinite}
          .enquiry-confirmation .button{min-width:8.5rem;margin-top:1.75rem;cursor:pointer;transition:transform 220ms ease,box-shadow 220ms ease,opacity 220ms ease}
          .enquiry-confirmation .button[hidden]{display:block;visibility:hidden;opacity:0;pointer-events:none;margin-top:.5rem;min-height:0;height:0;padding:0;border:0}
          .enquiry-confirmation .button:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgb(17 16 15/.15)}
          @keyframes solarist-enquiry-spin{to{transform:rotate(360deg)}}
          @keyframes solarist-enquiry-check{0%{opacity:0;transform:scale(.4) rotate(-18deg)}55%{opacity:1;transform:scale(1.16) rotate(3deg)}100%{opacity:1;transform:none}}
          @keyframes solarist-enquiry-progress{0%{transform:translateX(-120%)}55%{transform:translateX(115%)}100%{transform:translateX(270%)}}
          @media(max-width:36rem){.enquiry-confirmation{place-items:end center;padding:0}.enquiry-confirmation-card{width:100%;border-radius:12px 12px 0 0;padding:2rem 1.35rem 1.5rem;transform:translate3d(0,100%,0)}.enquiry-confirmation h2{font-size:clamp(2.15rem,13vw,3rem)}.enquiry-confirmation-mark{width:3.6rem;height:3.6rem}}
          @media(prefers-reduced-motion:reduce){.enquiry-confirmation,.enquiry-confirmation-card,.enquiry-confirmation-accent,.enquiry-confirmation-mark,.enquiry-confirmation-symbol,.enquiry-confirmation-progress span,.enquiry-confirmation .button{animation:none!important;transition:none!important}}
          </style>
          '''

          if 'id="solarist-enquiry-experience-v2"' not in text:
              text = text.replace('</head>', style + '</head>', 1)

          old_modal = '''<div class="enquiry-confirmation" id="enquiryConfirmation" aria-hidden="true">
            <div class="enquiry-confirmation-card" role="dialog" aria-modal="true" aria-labelledby="enquiryConfirmationTitle" tabindex="-1">
              <div class="enquiry-confirmation-mark" aria-hidden="true">✓</div>
              <h2 id="enquiryConfirmationTitle">Enquiry submitted.</h2>
              <p>Thank you for contacting Solarist. Your details have been received, and we will respond within one to two business days.</p>
              <button class="button primary" type="button" id="enquiryConfirmationClose">Close</button>
            </div>
          </div>'''

          new_modal = '''<div class="enquiry-confirmation" id="enquiryConfirmation" data-state="idle" aria-hidden="true">
            <div class="enquiry-confirmation-card" role="dialog" aria-modal="true" aria-labelledby="enquiryConfirmationTitle" aria-describedby="enquiryConfirmationCopy" tabindex="-1">
              <div class="enquiry-confirmation-accent" aria-hidden="true"></div>
              <div class="enquiry-confirmation-mark" aria-hidden="true"><span class="enquiry-confirmation-symbol">✓</span></div>
              <p class="enquiry-confirmation-kicker" id="enquiryConfirmationKicker">Enquiry received</p>
              <h2 id="enquiryConfirmationTitle">Enquiry submitted.</h2>
              <p class="enquiry-confirmation-copy" id="enquiryConfirmationCopy">Thank you for contacting Solarist. Your details have been received, and we will respond within one to two business days.</p>
              <div class="enquiry-confirmation-progress" aria-hidden="true"><span></span></div>
              <button class="button primary" type="button" id="enquiryConfirmationClose">Done</button>
            </div>
          </div>'''

          if old_modal in text:
              text = text.replace(old_modal, new_modal, 1)
          elif 'id="enquiryConfirmationKicker"' not in text:
              raise SystemExit('Expected confirmation modal markup was not found.')

          script = r'''<script id="solarist-apps-script-form-script">
          (() => {
            const RESPONSE_SOURCE = 'solarist-enquiry-v1';
            const form = document.getElementById('solaristEnquiryForm');
            const sink = document.getElementById('solaristSheetSink');
            const modal = document.getElementById('enquiryConfirmation');
            const modalCard = modal?.querySelector('.enquiry-confirmation-card');
            const markSymbol = modal?.querySelector('.enquiry-confirmation-symbol');
            const kicker = document.getElementById('enquiryConfirmationKicker');
            const heading = document.getElementById('enquiryConfirmationTitle');
            const copy = document.getElementById('enquiryConfirmationCopy');
            const closeButton = document.getElementById('enquiryConfirmationClose');
            if (!form || !sink || !modal || !modalCard || !markSymbol || !kicker || !heading || !copy || !closeButton) return;

            let pending = false;
            let timeoutId = 0;
            let closeTimer = 0;
            let lastFocused = null;
            let submitButton = null;
            let originalLabel = '';

            let state = form.querySelector('.form-submit-state');
            if (!state) {
              state = document.createElement('p');
              state.className = 'form-submit-state';
              state.setAttribute('role', 'status');
              state.setAttribute('aria-live', 'polite');
              form.appendChild(state);
            }

            const restoreButton = () => {
              if (!submitButton) return;
              submitButton.disabled = false;
              submitButton.textContent = originalLabel || 'Send enquiry';
            };

            const setModalState = (mode, message = '') => {
              modal.dataset.state = mode;
              modalCard.setAttribute('aria-busy', mode === 'sending' ? 'true' : 'false');

              if (mode === 'sending') {
                markSymbol.textContent = '';
                kicker.textContent = 'Secure submission';
                heading.textContent = 'Sending your enquiry…';
                copy.textContent = 'Saving your details and preparing the confirmation email.';
                closeButton.hidden = true;
                return;
              }

              if (mode === 'error') {
                markSymbol.textContent = '!';
                kicker.textContent = 'Submission not confirmed';
                heading.textContent = 'Please try again.';
                copy.textContent = message || 'We could not confirm delivery. Your form details are still here.';
                closeButton.textContent = 'Return to form';
                closeButton.hidden = false;
                return;
              }

              markSymbol.textContent = '✓';
              kicker.textContent = 'Enquiry received';
              heading.textContent = 'Enquiry submitted.';
              copy.textContent = 'Thank you for contacting Solarist. Your details have been received, and we will respond within one to two business days.';
              closeButton.textContent = 'Done';
              closeButton.hidden = false;
            };

            const openConfirmation = () => {
              window.clearTimeout(closeTimer);
              if (!modal.classList.contains('is-open')) lastFocused = document.activeElement;
              modal.classList.remove('is-closing');
              modal.classList.add('is-open');
              modal.setAttribute('aria-hidden', 'false');
              document.body.style.overflow = 'hidden';
              window.setTimeout(() => modalCard.focus(), 80);
            };

            const closeConfirmation = () => {
              if (pending || !modal.classList.contains('is-open')) return;
              modal.classList.add('is-closing');
              modal.setAttribute('aria-hidden', 'true');
              document.body.style.overflow = '';
              closeTimer = window.setTimeout(() => {
                modal.classList.remove('is-open', 'is-closing');
                lastFocused?.focus?.();
              }, 280);
            };

            const failSubmission = message => {
              pending = false;
              window.clearTimeout(timeoutId);
              restoreButton();
              state.setAttribute('role', 'alert');
              state.textContent = message || 'We could not confirm delivery. Please try again.';
              setModalState('error', state.textContent);
              openConfirmation();
            };

            closeButton.addEventListener('click', closeConfirmation);
            modal.addEventListener('click', event => {
              if (event.target === modal) closeConfirmation();
            });
            document.addEventListener('keydown', event => {
              if (event.key === 'Escape') closeConfirmation();
            });

            const responseOrigins = new Set([
              window.location.origin,
              'https://solarist.in',
              'https://www.solarist.in',
            ]);

            window.addEventListener('message', event => {
              if (!pending || !responseOrigins.has(event.origin)) return;
              const data = event.data;
              if (!data || data.source !== RESPONSE_SOURCE) return;

              if (!data.ok) {
                failSubmission(data.message);
                return;
              }

              pending = false;
              window.clearTimeout(timeoutId);
              form.reset();
              state.setAttribute('role', 'status');
              state.textContent = '';
              restoreButton();
              setModalState('success');
              openConfirmation();
            });

            form.addEventListener('submit', event => {
              event.preventDefault();
              if (pending) return;
              if (!form.checkValidity()) {
                form.reportValidity();
                return;
              }

              const honeypot = form.querySelector('[name="_honey"]');
              if (honeypot?.value) return;

              const sourceField = document.getElementById('formSourceUrl');
              if (sourceField) sourceField.value = window.location.href;

              submitButton = form.querySelector('button[type="submit"],input[type="submit"]');
              originalLabel = submitButton?.textContent || '';
              if (submitButton) {
                submitButton.disabled = true;
                submitButton.textContent = 'Sending…';
              }

              pending = true;
              state.setAttribute('role', 'status');
              state.textContent = 'Submitting your enquiry…';
              setModalState('sending');
              openConfirmation();
              timeoutId = window.setTimeout(() => {
                if (pending) failSubmission('The submission took too long to confirm. Please try again.');
              }, 20000);

              window.requestAnimationFrame(() => {
                try {
                  HTMLFormElement.prototype.submit.call(form);
                } catch (error) {
                  console.error('Solarist enquiry submission failed:', error);
                  failSubmission('We could not submit the enquiry. Please try again.');
                }
              });
            });
          })();
          </script>'''

          start_marker = '<script id="solarist-apps-script-form-script">'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('Enquiry script start marker was not found.')
          end = text.find('</script>', start)
          if end < 0:
              raise SystemExit('Enquiry script end marker was not found.')
          text = text[:start] + script + text[end + len('</script>'):]

          form_replacements = {
              '<form id="solaristEnquiryForm" ': '<form id="solaristEnquiryForm" autocomplete="on" ',
              '<input id="name" name="name" autocomplete="name" required>': '<input id="name" name="name" autocomplete="name" autocapitalize="words" required>',
              '<input id="company" name="company" autocomplete="organization">': '<input id="company" name="company" autocomplete="organization" autocapitalize="words">',
              '<input id="email" name="email" type="email" autocomplete="email" required>': '<input id="email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" required>',
              '<select id="market" name="project_market">': '<select id="market" name="project_market" autocomplete="on">',
              '<select id="service" name="service">': '<select id="service" name="service" autocomplete="on">',
              '<textarea id="message" name="message" required></textarea>': '<textarea id="message" name="message" autocomplete="on" autocapitalize="sentences" spellcheck="true" required></textarea>',
          }
          for old, new in form_replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'Expected form fragment was not found: {old}')

          required = [
              'solarist-enquiry-experience-v2',
              'data-state="idle"',
              "setModalState('sending')",
              'autocomplete="organization" autocapitalize="words"',
              'autocomplete="email" inputmode="email"',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing expected enquiry enhancements: {missing}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit enquiry polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No enquiry experience changes were needed.'
          else
            git commit -m 'Polish enquiry modal and improve autofill support'
            git push
          fi
