name: Purge Solarist Actions storage

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  purge:
    if: >-
      github.event.issue.title == 'Purge Solarist stored Actions data' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete all stored artifacts and caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          api = os.environ['GITHUB_API_URL']
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'solarist-storage-purge',
          }

          def request(method, endpoint):
              req = urllib.request.Request(f'{api}{endpoint}', method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  detail = error.read().decode('utf-8', 'replace')
                  raise RuntimeError(f'{method} {endpoint}: {error.code} {detail}') from error

          artifact_count = artifact_bytes = 0
          while True:
              data = request('GET', f'/repos/{repo}/actions/artifacts?per_page=100&page=1')
              artifacts = data.get('artifacts', [])
              if not artifacts:
                  break
              for artifact in artifacts:
                  artifact_count += 1
                  artifact_bytes += int(artifact.get('size_in_bytes') or 0)
                  request('DELETE', f"/repos/{repo}/actions/artifacts/{artifact['id']}")

          cache_count = cache_bytes = 0
          while True:
              data = request('GET', f'/repos/{repo}/actions/caches?per_page=100&page=1')
              caches = data.get('actions_caches', [])
              if not caches:
                  break
              for cache in caches:
                  cache_count += 1
                  cache_bytes += int(cache.get('size_in_bytes') or 0)
                  request('DELETE', f"/repos/{repo}/actions/caches/{cache['id']}")

          with open('/tmp/purge-summary.env', 'w', encoding='utf-8') as output:
              output.write(f'ARTIFACT_COUNT={artifact_count}\n')
              output.write(f'ARTIFACT_BYTES={artifact_bytes}\n')
              output.write(f'CACHE_COUNT={cache_count}\n')
              output.write(f'CACHE_BYTES={cache_bytes}\n')
          print(f'Deleted {artifact_count} artifacts ({artifact_bytes} bytes) and {cache_count} caches ({cache_bytes} bytes).')
          PY

      - name: Remove this maintenance workflow
        uses: actions/checkout@v6

      - name: Commit cleanup completion
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/purge-summary.env
          git rm .github/workflows/purge-actions-storage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Purge stored GitHub Actions data' \
            -m "Deleted ${ARTIFACT_COUNT} artifacts (${ARTIFACT_BYTES} bytes) and ${CACHE_COUNT} caches (${CACHE_BYTES} bytes)."
          git push

      - name: Close maintenance issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            --data '{"state":"closed","state_reason":"completed"}' >/dev/null
