name: Run parallel enquiry form patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-parallel-form-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Execute staged form patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'BOOT'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-parallel-enquiry-form.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          if marker not in workflow:
              raise SystemExit('Embedded patch was not found')
          block = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(code, 'parallel-form-patch.py', 'exec'))
          BOOT
          rm -f .github/workflows/apply-parallel-enquiry-form.yml
          rm -f .github/workflows/run-parallel-form-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows
          git commit -m 'Submit enquiries to Sheets and FormSubmit in parallel'
          git push
