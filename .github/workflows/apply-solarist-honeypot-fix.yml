name: Apply Solarist enquiry logging fix

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.issue.title == 'Apply Solarist enquiry logging fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Remove false-positive honeypot and require a logged response
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          honeypot_input = '<input type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">'
          text = text.replace(honeypot_input, '', 1)

          honeypot_js = """    const honeypot = form.querySelector('[name=\"_honey\"]');
    if (honeypot?.value) return;

"""
          text = text.replace(honeypot_js, '', 1)

          old_check = """    if (!data.ok) {
      failSubmission(data.message);
      return;
    }
"""
          new_check = """    if (!data.ok || data.logged !== true) {
      failSubmission(data.message || 'The enquiry was not recorded. Please try again.');
      return;
    }
"""
          if old_check not in text:
              raise SystemExit('Expected Apps Script response check was not found')
          text = text.replace(old_check, new_check, 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/apply-solarist-honeypot-fix.yml
          rm -f .github/workflows/fix-solarist-honeypot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows
          git commit -m 'Fix enquiry logging false positive'
          git push
