name: Fix enquiry confirmation popup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-enquiry-popup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch confirmation messaging
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = "if (!pending || event.source !== sink.contentWindow) return;"
          new = "if (!pending || event.origin !== window.location.origin) return;"
          if old not in text:
              raise SystemExit('Expected message listener was not found in index.html')
          index.write_text(text.replace(old, new, 1), encoding='utf-8')

          bridge = Path('enquiry-response.html')
          bridge_text = bridge.read_text(encoding='utf-8')
          bridge_text = bridge_text.replace('window.parent.postMessage(payload,location.origin)', 'window.top.postMessage(payload,location.origin)')
          bridge_text = bridge_text.replace("window.parent.postMessage({source:'solarist-enquiry-v1',ok:false,logged:false,message:'We could not confirm the enquiry response. Please try again.'},location.origin)", "window.top.postMessage({source:'solarist-enquiry-v1',ok:false,logged:false,message:'We could not confirm the enquiry response. Please try again.'},location.origin)")
          bridge.write_text(bridge_text, encoding='utf-8')
          PY

          rm .github/workflows/fix-enquiry-popup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html enquiry-response.html .github/workflows/fix-enquiry-popup.yml
          git commit -m "Fix enquiry confirmation popup messaging"
          git push
