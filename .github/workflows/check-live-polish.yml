name: Check live Solarist enquiry polish

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    if: github.event_name != 'issues' || github.event.issue.title == 'Check Solarist enquiry polish'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Install clean same-page navigation
        shell: bash
        env:
          NAV_SCRIPT_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'id="solarist-clean-section-navigation"'

          if marker not in text:
              script = base64.b64decode(os.environ['NAV_SCRIPT_B64']).decode('utf-8')
              closing = '</body></html>'
              if closing not in text:
                  raise SystemExit('Closing body marker not found.')
              text = text.replace(closing, script + closing, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit navigation change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Clean same-page navigation is already installed.'
          else
            git commit -m 'Keep same-page navigation URLs clean'
            git push
          fi
