name: Deploy Solarist to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate and stage static site
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s enquiry-response.html
          test -s CNAME
          test "$(tr -d '\r\n' < CNAME)" = "solarist.in"

          mkdir -p _site/brand/volume-02 _site/assets
          cp index.html enquiry-response.html CNAME robots.txt sitemap.xml .nojekyll 1739488938549.jpg _site/
          cp -R brand/volume-02/assets _site/brand/volume-02/
          cp -R brand/volume-02/tokens _site/brand/volume-02/
          cp -R assets/. _site/assets/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
