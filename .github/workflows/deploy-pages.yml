name: Deploy Solarist to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'issues' || github.event.issue.title == 'Deploy Solarist website'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate static site
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s CNAME
          test "$(tr -d '\r\n' < CNAME)" = "solarist.in"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
          include-hidden-files: true

  deploy:
    if: github.event_name != 'issues' || github.event.issue.title == 'Deploy Solarist website'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
