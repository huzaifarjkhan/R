name: Run Solarist UI and form fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-solarist-ui-form-fix.yml'
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.issue.title == 'Run Solarist UI and form fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Execute the prepared one-time patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-solarist-ui-form-fix.yml').read_text(encoding='utf-8')
          marker_start = "          python - <<'PY'\n"
          marker_end = "\n          PY\n\n          rm -f .github/workflows/apply-solarist-ui-form-fix.yml"
          if marker_start not in workflow or marker_end not in workflow:
              raise SystemExit('Prepared patch script could not be extracted')
          embedded = workflow.split(marker_start, 1)[1].split(marker_end, 1)[0]
          exec(compile(textwrap.dedent(embedded), 'solarist-ui-form-fix', 'exec'))
          PY

          rm -f .github/workflows/apply-solarist-ui-form-fix.yml
          rm -f .github/workflows/run-solarist-ui-form-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows
          git commit -m 'Fix website enquiry confirmation and polish interactions'
          git push
